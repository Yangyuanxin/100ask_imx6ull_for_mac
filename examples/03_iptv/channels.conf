# 频道表: 频道名|地址
#
# 一行一个频道, # 开头是注释。| 前面是频道名(支持中文), 后面是播放地址。
# 支持 http / https / m3u8(HLS) / rtmp / rtsp / rtp 组播 等 ffmpeg 能解的地址。
#
# ── 加频道(推荐: 会当场试播并测出实际帧率) ──────────────
#     ./tools/add_channel.sh "频道名" "地址"
#   例: ./tools/add_channel.sh "央视一套" "rtp://239.3.1.xxx:8000"
#
# ── 关于频道来源 ────────────────────────────────────────
# 网上流传的 "CCTV/卫视 m3u8 聚合列表" 基本都是未授权转发的盗链源,
# 这类地址我不提供, 也请不要放进这里。请使用你自己有接收权限的源:
#   1) 家里运营商 IPTV 的组播地址 —— 你已付费的业务, 最稳也最合规
#      (从自家 IPTV 盒子抓包, 或查运营商公开的频道列表文件)
#   2) 电视台自己对外免费公开的直播地址
#   3) 你自己从官方直播页面复制下来的地址
#
# ── 硬件提醒 ────────────────────────────────────────────
# i.MX6ULL 是单核, 没有硬件解码(VPU), 全靠 CPU 软解。
# 实测(锁 792MHz, 满屏输出, fast_bilinear):
#   360p 放大到满屏 .......... 11 FPS
#   1024x576(正好等于屏幕) ... 13 FPS  ← 不用放大, 反而更快
#   720p ..................... 个位数帧率
#   1080p .................... 基本解不动(0 帧)
# 所以挑源的原则是: 分辨率越接近 1024x576 越好, 不要 1080p。
#
# ── 实测状态一览(2026-10, 板子 WiFi) ───────────────────
#   ✅ CCTV+ 360p        640x360    11 FPS
#   ✅ CGTN 财经 360p    640x360
#   ✅ France 24 ×4      1024x576   13 FPS
#   ⚠️ CCTV+ 720p        1280x720   个位数, 留着做画质对比
#   ❌ DW / CGTN(新增)   见下面分组注释, 已注释掉未启用
#
# ── 国内源(原有) ────────────────────────────────────────
# CCTV+ 这个 HLS 源有 4 个码率变体:
#   index_1 = 1080p/4.6M   index_2 = 720p/2.8M
#   index_3 = 504p/1.3M    index_4 = 360p/1.0M
# ffmpeg 默认挑码率最高的那个(1080p), 这块板单核软解实测 0 帧,
# 所以这里直接写死低码率子地址 —— 第一个 360p 能跑, 第二个 720p 用来对比。
CCTV+ 直播(360p)|https://fastlive.cctvplus.com/out/v1/ca6f9297b7314a63959435028af287fc/index_4.m3u8
# CGTN 财经这个源的变体编号是乱的(1080p=index_6, 720p=index_8), 但最低档同样是 index_4
CGTN 财经(360p)|https://fastlive.cctvplus.com/out/v1/2b3d8a0c805d437f9dc85b764c2ac599/index_4.m3u8
CCTV+ 高清(720p)|https://fastlive.cctvplus.com/out/v1/ca6f9297b7314a63959435028af287fc/index_2.m3u8

